<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>태극기</title>
    <style>
      html {
        zoom: 0.3;
        margin: 0 auto;
      }

      #flag {
        position: relative;
        width: 1800px;
        height: 1200px;
        border: 1px solid black;
        display: flex;
        justify-content: center;
      }

      #group1 {
        display: inline-flex;
        align-items: center;
        rotate: 33.5deg;
      }

      #gun {
        margin-right: 150px;
        width: 200px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
      }

      #gun > div,
      #gon > div,
      #gam > div,
      #li > div {
        background: #000;
      }

      #circles {
        width: 600px;
        height: 600px;
        position: relative;
      }

      #top {
        width: 600px;
        height: 300px;
        border-radius: 300px 300px 0 0;
        background-color: red;
      }

      #bottom {
        width: 600px;
        height: 300px;
        border-radius: 0 0 300px 300px;
        background-color: blue;
      }

      #left {
        width: 300px;
        height: 300px;
        border-radius: 150px;
        background-color: red;
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
      }

      #right {
        width: 300px;
        height: 300px;
        border-radius: 150px;
        background-color: blue;
        position: absolute;
        right: 0;
        bottom: 50%;
        transform: translateY(50%);
      }

      #gon {
        margin-left: 150px;
        width: 200px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(3, 3fr);
        gap: 25px;
      }

      #group2 {
        display: inline-flex;
        position: absolute;
        align-self: center;
        justify-self: center;
        rotate: -33.5deg;
      }

      #li {
        margin-right: 450px;
        width: 200px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        grid-auto-flow: column;
        gap: 25px;
      }
      #li :first-child,
      #li :last-child {
        grid-row: span 2;
      }

      #gam {
        margin-left: 450px;
        width: 200px;
        height: 300px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 25px;
      }
      #gam :nth-child(2) {
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div id="flag">
      <div id="group1">
        <div id="gun">
          <div></div>
          <div></div>
          <div></div>
        </div>
        <div id="circles">
          <div id="top"></div>
          <div id="bottom"></div>
          <div id="left"></div>
          <div id="right"></div>
        </div>
        <div id="gon">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <div id="group2">
        <div id="li">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <div id="gam">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>
    </div>
  </body>
</html>
